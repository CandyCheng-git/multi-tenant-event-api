name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MultiTenantEventApi.sln
      - run: dotnet build MultiTenantEventApi.sln --configuration Release --no-restore
      - run: dotnet test MultiTenantEventApi.sln --configuration Release --no-build --verbosity normal
